packages:
  - apps/*
  - packages/*
  - e2e

enablePrePostScripts: true

# Invoice PDFs convert WebP shop logos via sharp (pdfkit is PNG/JPEG only)
onlyBuiltDependencies:
  - sharp

ignoredBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - msgpackr-extract
  - prisma
  - unrs-resolver

name: Railway PR Preview Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional public preview URL (web or API)
        required: false
        type: string

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"

jobs:
  preview-smoke:
    name: Railway PR Preview Smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, ' / gold-shop-app-pr-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INPUT_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
      DEPLOY_ENV: ${{ github.event.deployment.environment }}
      EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
    steps:
      - name: Resolve preview hosts and verify commit
        id: service
        run: |
          set -euo pipefail
          EXPECTED="$EXPECTED_SHA"

          host_of() {
            echo "$1" | sed -E 's#^https://([^/]+).*#\1#'
          }

          is_dashboard_url() {
            local host
            host="$(host_of "$1")"
            [[ "$host" == "railway.com" || "$host" == "www.railway.com" ||
               "$host" == "railway.app" || "$host" == "www.railway.app" ]]
          }

          is_public_app_url() {
            [[ "$1" == https://* ]] || return 1
            is_dashboard_url "$1" && return 1
            return 0
          }

          CANDIDATES=()
          add_candidate() {
            local url="${1%/}"
            [[ -n "$url" ]] || return 0
            local existing
            for existing in "${CANDIDATES[@]+"${CANDIDATES[@]}"}"; do
              [[ "$existing" == "$url" ]] && return 0
            done
            CANDIDATES+=("$url")
          }

          if is_public_app_url "${INPUT_BASE_URL:-}"; then
            add_candidate "$INPUT_BASE_URL"
          elif [[ -n "${INPUT_BASE_URL:-}" ]]; then
            echo "Ignoring Railway dashboard URL: $INPUT_BASE_URL"
          fi

          if [[ "${DEPLOY_ENV:-}" =~ gold-shop-app-pr-[0-9]+ ]]; then
            SLUG="${BASH_REMATCH[0]}"
            add_candidate "https://gold-shopweb-${SLUG}.up.railway.app"
            add_candidate "https://gold-shopapi-${SLUG}.up.railway.app"
          fi

          if [[ ${#CANDIDATES[@]} -eq 0 ]]; then
            echo "::error::No public Railway preview URL. Pass base_url or deploy a gold-shop-app-pr-* environment."
            exit 1
          fi

          echo "Candidates:"
          printf '  %s\n' "${CANDIDATES[@]}"

          probe_web_sha() {
            local base="$1"
            local code
            code="$(curl -sS -o /tmp/build-info.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$base/api/build-info" || true)"
            [[ "$code" == "200" ]] || return 1
            jq -r '.sha // empty' /tmp/build-info.json
          }

          probe_api_sha() {
            local base="$1"
            local code
            code="$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$base/api/health" || true)"
            [[ "$code" == "200" ]] || return 1
            jq -r '.release.sha // .data.release.sha // empty' /tmp/health.json
          }

          for attempt in $(seq 1 8); do
            WEB_MATCH=""
            API_MATCH=""
            for base in "${CANDIDATES[@]}"; do
              WEB_SHA="$(probe_web_sha "$base" || true)"
              API_SHA="$(probe_api_sha "$base" || true)"
              echo "$base web=${WEB_SHA:-none} api=${API_SHA:-none}"
              if [[ "$WEB_SHA" == "$EXPECTED" ]]; then
                WEB_MATCH="$base"
              fi
              if [[ "$API_SHA" == "$EXPECTED" ]]; then
                API_MATCH="$base"
              fi
            done

            if [[ -n "$WEB_MATCH" ]]; then
              echo "Web preview serves $EXPECTED at $WEB_MATCH"
              echo "BASE_URL=$WEB_MATCH" >> "$GITHUB_ENV"
              echo "is_web=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -n "$API_MATCH" ]]; then
              echo "API preview serves $EXPECTED at $API_MATCH"
              echo "BASE_URL=$API_MATCH" >> "$GITHUB_ENV"
              echo "is_web=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/8: expected SHA $EXPECTED not on preview yet"
            [[ $attempt -eq 8 ]] || sleep 15
          done

          echo "::error::Neither web nor API preview serves commit $EXPECTED"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.service.outputs.is_web == 'true'
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        if: steps.service.outputs.is_web == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.service.outputs.is_web == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install browser test dependencies
        if: steps.service.outputs.is_web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.service.outputs.is_web == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Test the deployed preview
        if: steps.service.outputs.is_web == 'true'
        working-directory: e2e
        run: npx playwright test homepage.spec.ts auth.spec.ts --project=chromium --workers=1
        env:
          CI: "true"
          BASE_URL: ${{ env.BASE_URL }}

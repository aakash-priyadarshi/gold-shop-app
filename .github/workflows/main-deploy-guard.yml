# Pre-deploy validation for Railway. Railway's Wait for CI setting can safely
# wait for this workflow because deployment verification happens separately in
# Post-Deploy Critical Checks.

name: Deploy Guard

on:
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  validate:
    name: 🔐 Pre-Deploy Validation
    runs-on: ubuntu-latest
    outputs:
      has_migrations: ${{ steps.check-migrations.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        working-directory: packages/shared
        run: pnpm build

      - name: Generate and validate Prisma Client
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma validate

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Check for migrations in this push
        id: check-migrations
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- apps/api/prisma/migrations/)
          if [[ -n "$CHANGED" ]]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New migrations detected"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record exact push range
        run: |
          mkdir -p .deploy-range
          jq -n --arg before "${{ github.event.before }}" --arg after "${{ github.sha }}" \
            '{before:$before,after:$after}' > .deploy-range/range.json

      - name: Upload push range
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-range
          path: .deploy-range/range.json
          retention-days: 1

  migrate:
    name: 🗃️ Backup and Run Migrations
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_migrations == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Install AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            pip install --quiet awscli
          fi

      - name: Required pre-migration backup
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'backups' }}
        run: |
          chmod +x scripts/pre-migrate-backup.sh
          ./scripts/pre-migrate-backup.sh

      - name: Deploy migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

  deploy-summary:
    name: 📋 Pre-Deploy Summary
    runs-on: ubuntu-latest
    needs: [validate, migrate]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Pre-deploy guard"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Validation | ${{ needs.validate.result }} |"
            echo "| Migration | ${{ needs.migrate.result }} |"
            echo "| Commit | ${{ github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert and fail on a critical error
        if: needs.validate.result != 'success' || (needs.migrate.result != 'success' && needs.migrate.result != 'skipped')
        run: |
          if ! jq -n \
            --arg message "Pre-deploy guard failed for commit ${{ github.sha }} (validation=${{ needs.validate.result }}, migration=${{ needs.migrate.result }})" \
            --arg page "github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{errorMessage:$message,page:$page,platform:"web",userRole:"SYSTEM",userAction:"Pre-deploy validation and migration",frustrationType:"deployment"}' \
            | curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -X POST "${{ secrets.PRODUCTION_API_URL }}/api/crash-reports" \
                -H "Content-Type: application/json" --data-binary @-; then
            echo "::error::Failed to deliver the pre-deploy incident alert"
          fi
          exit 1

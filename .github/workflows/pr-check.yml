# Pull Request Validation Pipeline
# Runs comprehensive checks on every PR to prevent production breaks

name: PR Check

on:
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════
  # Stage 1: Install & Cache Dependencies
  # ══════════════════════════════════════════════════════════
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          if ! pnpm install --frozen-lockfile --offline 2>/dev/null; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json files"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════
  # Stage 2: Lint & Format Check
  # ══════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Next security compensating control
        run: pnpm check:next-security

      - name: Test Next security guard
        run: pnpm test:next-security

      - name: Test image worker security controls
        run: pnpm test:image-worker-security

      - name: Lint API
        working-directory: apps/api
        run: pnpm lint
        continue-on-error: false

      - name: Lint Web (if exists)
        working-directory: apps/web
        run: pnpm lint || echo "Web lint not configured"
        continue-on-error: true

      - name: Check new seller dashboard strings are translatable
        working-directory: apps/web
        run: pnpm check:i18n -- --base "origin/${{ github.base_ref }}"

  # ══════════════════════════════════════════════════════════
  # Stage 3: TypeScript Type Check
  # ══════════════════════════════════════════════════════════
  typecheck:
    name: 📝 TypeScript Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        working-directory: packages/shared
        run: pnpm build

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: TypeCheck API
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: TypeCheck Web
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

  # ══════════════════════════════════════════════════════════
  # Stage 4: Build Verification
  # ══════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        working-directory: packages/shared
        run: pnpm build

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Build Web
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_SECRET: ci-build-only-not-used-at-runtime

  # ══════════════════════════════════════════════════════════
  # Stage 5: Prisma Migration Safety Check
  # ══════════════════════════════════════════════════════════
  prisma-check:
    name: 🗃️ Prisma Migration Safety
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prisma -d prisma_shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHADOW_DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma_shadow?schema=public
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for diff
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DATABASE_URL }}
        run: npx prisma validate

      - name: Check Prisma Format
        working-directory: apps/api
        run: |
          npx prisma format
          if [[ -n $(git diff --name-only apps/api/prisma/schema.prisma) ]]; then
            echo "::error::Prisma schema is not properly formatted. Run 'npx prisma format' locally."
            exit 1
          fi

      - name: Check for new migrations
        id: migration-check
        working-directory: apps/api
        run: |
          # Get list of new migration files in this PR
          BASE_REF="origin/${{ github.base_ref }}"
          NEW_MIGRATIONS=$(git diff --name-only "$BASE_REF"...HEAD -- prisma/migrations/ | grep "\.sql$" || true)
          if [[ -n "$NEW_MIGRATIONS" ]]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "::notice::New migrations detected:"
            echo "$NEW_MIGRATIONS"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "::notice::No new migrations in this PR"
          fi

      - name: Detect Destructive Changes
        if: steps.migration-check.outputs.has_migrations == 'true'
        working-directory: apps/api
        run: |
          # Check for destructive operations in new migrations
          DESTRUCTIVE_PATTERNS="DROP TABLE|DROP COLUMN|ALTER TABLE.*DROP|TRUNCATE|DELETE FROM"
          BASE_REF="origin/${{ github.base_ref }}"
          NEW_MIGRATIONS=$(git diff --name-only "$BASE_REF"...HEAD -- prisma/migrations/ | grep "\.sql$" || true)

          FOUND_DESTRUCTIVE=false
          for migration in $NEW_MIGRATIONS; do
            if grep -iE "$DESTRUCTIVE_PATTERNS" "$migration" 2>/dev/null; then
              echo "::warning file=$migration::⚠️ DESTRUCTIVE CHANGE DETECTED in $migration"
              FOUND_DESTRUCTIVE=true
            fi
          done

          if [[ "$FOUND_DESTRUCTIVE" == "true" ]]; then
            echo ""
            echo "::warning::🚨 DESTRUCTIVE MIGRATIONS DETECTED!"
            echo "::warning::These changes may cause data loss. Please ensure:"
            echo "::warning::  1. Data backup has been taken"
            echo "::warning::  2. Migration has been tested on staging"
            echo "::warning::  3. Rollback plan is documented"
            # Don't fail, but warn loudly
          fi

      - name: Check Migration Drift
        working-directory: apps/api
        run: |
          # Generate migration diff to check if schema matches migrations
          npx prisma migrate diff \
            --from-schema-datamodel prisma/schema.prisma \
            --to-migrations prisma/migrations \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code || {
              echo "::error::Schema drift detected! Your schema.prisma doesn't match migrations."
              echo "::error::Run 'npx prisma migrate dev' to create a new migration."
              exit 1
            }

  # ══════════════════════════════════════════════════════════
  # Stage 6: Shared, Web, and API Unit Tests
  # ══════════════════════════════════════════════════════════
  test-api:
    name: 🧪 Shared, Web & API Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: goldshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore dependencies
        uses: actions/cache@v5
        with:
          path: |
            **/node_modules
          key: pnpm-${{ runner.os }}-${{ github.sha }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Apply Migration History to Fresh Test DB
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test

      - name: Verify Test DB Migration Status
        working-directory: apps/api
        run: pnpm exec prisma migrate status
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test

      - name: Build Shared Package
        working-directory: packages/shared
        run: pnpm build

      - name: Run Shared Tests
        working-directory: packages/shared
        run: pnpm test

      - name: Run Web Tests
        working-directory: apps/web
        run: pnpm test

      - name: Run API Tests
        working-directory: apps/api
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          NODE_ENV: test

      - name: Run Karigar Concurrency E2E Tests
        # A failed bootstrap must not reserve the shared test job indefinitely.
        timeout-minutes: 10
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.json --runInBand --forceExit --testPathPattern=karigar-concurrency.e2e-spec.ts
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/goldshop_test
          NODE_ENV: test

  # ══════════════════════════════════════════════════════════
  # Stage 7: Critical journeys against this PR's code
  # ══════════════════════════════════════════════════════════
  critical-e2e:
    name: 🛡️ Critical Journey E2E (PR Code)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: orivraa_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d orivraa_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/orivraa_e2e
      DIRECT_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/orivraa_e2e
      TEST_DATABASE_URL: postgresql://e2e:e2e@localhost:5432/orivraa_e2e
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate isolated E2E credentials
        shell: bash
        run: |
          E2E_PASSWORD=$(openssl rand -hex 32)
          E2E_JWT=$(openssl rand -hex 32)
          E2E_BYPASS=$(openssl rand -hex 32)
          E2E_NEXTAUTH=$(openssl rand -hex 32)
          E2E_TOKEN_ENCRYPTION=$(openssl rand -hex 32)
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$E2E_JWT"
          echo "::add-mask::$E2E_BYPASS"
          echo "::add-mask::$E2E_NEXTAUTH"
          echo "::add-mask::$E2E_TOKEN_ENCRYPTION"
          echo "E2E_SHOP_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$E2E_JWT" >> "$GITHUB_ENV"
          echo "TURNSTILE_BYPASS_SECRET=$E2E_BYPASS" >> "$GITHUB_ENV"
          echo "NEXTAUTH_SECRET=$E2E_NEXTAUTH" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$E2E_TOKEN_ENCRYPTION" >> "$GITHUB_ENV"

      - name: Build and seed the PR application
        run: |
          pnpm --filter @gold-shop/shared build
          pnpm --filter @gold-shop/api exec prisma generate
          pnpm --filter @gold-shop/api exec prisma migrate deploy
          pnpm --filter @gold-shop/api exec tsx prisma/seeds/subscription-plans.seed.ts
          SEED_DEMO_PASSWORD="$E2E_SHOP_PASSWORD" pnpm --filter @gold-shop/api exec tsx prisma/seed-demo.ts
          pnpm --filter @gold-shop/api exec tsx prisma/seed-e2e.ts
          pnpm --filter @gold-shop/api build
          pnpm --filter gold-shop-web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_MOBILE_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""

      - name: Start API and web
        run: |
          nohup env PORT=3001 pnpm --filter @gold-shop/api start:prod > api-e2e.log 2>&1 &
          API_PID=$!
          nohup env PORT=3000 pnpm --filter gold-shop-web start > web-e2e.log 2>&1 &
          WEB_PID=$!
          for attempt in $(seq 1 60); do
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
            WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/auth/login || true)
            if [[ "$API_STATUS" == "200" && "$WEB_STATUS" == "200" ]]; then
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::PR API exited before becoming ready"
              tail -200 api-e2e.log || true
              exit 1
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              echo "::error::PR web app exited before becoming ready"
              tail -200 web-e2e.log || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::PR application did not become ready"
          tail -200 api-e2e.log || true
          tail -200 web-e2e.log || true
          exit 1
        env:
          FRONTEND_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Create authenticated E2E session
        run: node e2e/scripts/api-login.mjs
        env:
          E2E_API_URL: http://localhost:3001/api
          E2E_WEB_URL: http://localhost:3000
          E2E_SHOP_EMAIL: demo-shop@orivraa.com

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run authenticated critical pages and API pipeline
        run: |
          node e2e/scripts/api-core-pipeline.mjs
          node e2e/scripts/api-critical-write-journeys.mjs
          cd e2e
          npx playwright test core-sales-pipeline.spec.ts --project=chromium --workers=1
        env:
          CI: "true"
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001/api
          E2E_API_URL: http://localhost:3001/api
          E2E_WEB_URL: http://localhost:3000
          E2E_ALLOW_WRITES: "true"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-critical-e2e-${{ github.event.pull_request.number }}
          path: |
            api-e2e.log
            web-e2e.log
            playwright-report/
            e2e-results/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # Final: PR Status Summary
  # ══════════════════════════════════════════════════════════
  pr-summary:
    name: ✅ PR Ready
    runs-on: ubuntu-latest
    needs: [build, prisma-check, test-api, critical-e2e]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build job failed"
            exit 1
          fi
          if [[ "${{ needs.prisma-check.result }}" != "success" ]]; then
            echo "::error::Prisma check failed"
            exit 1
          fi
          if [[ "${{ needs.test-api.result }}" != "success" ]]; then
            echo "::error::API tests failed"
            exit 1
          fi
          if [[ "${{ needs.critical-e2e.result }}" != "success" ]]; then
            echo "::error::Critical journey E2E failed"
            exit 1
          fi
          echo "✅ All critical checks passed!"

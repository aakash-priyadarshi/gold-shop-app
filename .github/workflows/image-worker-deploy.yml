name: Deploy image worker

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cloudflare-worker/src/**"
      - "cloudflare-worker/wrangler.toml"
      - "cloudflare-worker/package.json"
      - "cloudflare-worker/package-lock.json"
      - ".github/workflows/image-worker-deploy.yml"

concurrency:
  group: image-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Deploy production worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

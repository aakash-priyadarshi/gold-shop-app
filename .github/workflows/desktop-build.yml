# ═══════════════════════════════════════════════════════════
# Orivraa Desktop — Build & Release
# Builds Windows (MSI + NSIS) and macOS (DMG) installers
# Triggered on version tags or manual dispatch
#
# Pipeline per platform:
#   1. Verify desktop frontend (pre-built splash screen in dist-desktop/)
#   2. Build Tauri app with signing (tauri-action → GitHub Release)
#   3. Upload installers to Cloudflare R2 (releases.orivraa.com)
#   4. Upload platform-specific updater manifest artifacts
#   5. Publish release metadata to API (/api/releases/publish)
#   6. Merge platform manifests once and publish latest.json to R2 + GitHub
#
# Updater strategy:
#   - Installers for the latest version live on R2 (releases.orivraa.com/desktop/latest/)
#   - latest.json (on GitHub Release + R2) lists platform entries whose url fields point to R2
#   - GitHub Release assets keep versioned installers for older/manual downloads
#   - The desktop app checks GitHub latest.json first, then R2 latest.json (same manifest)
#
# Required GitHub secrets:
#   TAURI_SIGNING_PRIVATE_KEY     — Tauri updater signing key (base64)
#   R2_ACCOUNT_ID                 — Cloudflare account ID
#   R2_ACCESS_KEY_ID              — R2 API token access key
#   R2_SECRET_ACCESS_KEY          — R2 API token secret
#   ORIVRAA_ADMIN_TOKEN           — Admin JWT for /api/releases/publish
#
# Optional (for macOS code signing in the future):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# ═══════════════════════════════════════════════════════════

name: Desktop Build

on:
  push:
    tags:
      - "desktop-v*" # e.g., desktop-v0.1.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 0.1.0)"
        required: false
        default: "dev"
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  PYTHONIOENCODING: utf-8
  # R2 configuration (S3-compatible endpoint)
  R2_BUCKET: orivraa-releases
  R2_ENDPOINT: https://c3219a748734c4ae628206c10c8b2c05.r2.cloudflarestorage.com
  AWS_REGION: auto
  AWS_EC2_METADATA_DISABLED: true
  # R2 credentials — set directly as env vars (masked by GitHub Actions) instead of
  # writing to $GITHUB_ENV, which can expose secrets if a step fails mid-write.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # ═══════════════════════════════════════════════════════════
  # Extract version from tag or input
  # ═══════════════════════════════════════════════════════════
  resolve-version:
    name: 📋 Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build_windows: ${{ steps.platform.outputs.windows }}
      should_build_macos: ${{ steps.platform.outputs.macos }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/desktop-v}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Read from Cargo.toml
            echo "No version specified, reading from Cargo.toml"
            # We'll need to checkout for this, but for tag pushes it's in the tag
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Determine platform targets
        id: platform
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"
          if [[ "$PLATFORM" == "all" || "$IS_TAG" == "true" ]]; then
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "macos=true" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "windows" ]]; then
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "macos=false" >> $GITHUB_OUTPUT
          elif [[ "$PLATFORM" == "macos" ]]; then
            echo "windows=false" >> $GITHUB_OUTPUT
            echo "macos=true" >> $GITHUB_OUTPUT
          else
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "macos=true" >> $GITHUB_OUTPUT
          fi

  # ─── Windows Build ────────────────────────────────────
  build-windows:
    name: 🪟 Windows Build & Release
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build_windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      artifact-paths: ${{ steps.tauri-build.outputs.artifactPaths }}
      release-id: ${{ steps.tauri-build.outputs.releaseId }}
      release-url: ${{ steps.tauri-build.outputs.releaseUrl }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Verify desktop frontend (splash screen)
        shell: bash
        run: |
          # The desktop app uses a pre-built splash screen (dist-desktop/index.html)
          # that redirects to https://www.orivraa.com/auth/login.
          # No Next.js static export is needed — the app is a thin wrapper
          # around the production website.
          if [[ ! -f apps/desktop/dist-desktop/index.html ]]; then
            echo "ERROR: dist-desktop/index.html not found"
            exit 1
          fi
          echo "Desktop splash screen verified: dist-desktop/index.html"

      - name: Build Tauri app (signed)
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v${{ needs.resolve-version.outputs.version }}
          releaseName: "Orivraa Desktop v${{ needs.resolve-version.outputs.version }}"
          releaseBody: |
            ## Orivraa Desktop v${{ needs.resolve-version.outputs.version }}

            ### Windows Installers
            - **MSI**: Standard Windows Installer
            - **EXE (NSIS)**: Interactive installer with language selection

            ### Downloads
            - **Latest version (R2)**: https://releases.orivraa.com/desktop/latest/
            - **This version (GitHub)**: See assets below

            > R2 hosts only the latest version. Older versions are available exclusively on GitHub Releases.

            Download and run the installer. The app will auto-update on future releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Sign Windows updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python apps/desktop/scripts/sign-updater-artifacts.py --platform windows

      - name: Clean old installers from R2 latest/
        shell: bash
        run: |
          R2_LATEST="s3://${R2_BUCKET}/desktop/latest"
          echo "Cleaning old files from ${R2_LATEST}/ ..."
          # Delete all objects under desktop/latest/ (old version's installers)
          aws s3 rm "${R2_LATEST}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --recursive \
            --exclude "latest.json" \
            --no-progress 2>/dev/null || true
          echo "R2 latest/ cleaned (latest.json preserved)"

      - name: Upload installers to R2 (latest only)
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          R2_BASE="s3://${R2_BUCKET}/desktop"

          # Parse artifact paths (JSON array) and upload each
          ARTIFACTS='${{ steps.tauri-build.outputs.artifactPaths }}'
          echo "Artifact paths: $ARTIFACTS"

          # Use Python to parse JSON and iterate (available on windows-latest)
          # Use raw string (r''') so backslashes in Windows paths are not
          # interpreted as Python escape sequences before json.loads sees them.
          python -c "
          import json, subprocess, sys, os, glob
          raw = r'''$ARTIFACTS'''
          if raw == 'null' or not raw.strip():
              artifacts = []
          else:
              artifacts = json.loads(raw)
          if not artifacts:
              print('No artifact paths returned, searching manually...')
              base = 'apps/desktop/src-tauri/target/release/bundle'
              for pattern in [
                  f'{base}/nsis/*.exe',
                  f'{base}/msi/*.msi',
                  f'{base}/nsis/*.exe.sig',
              ]:
                  artifacts.extend(glob.glob(pattern))
          for a in artifacts:
              if not os.path.exists(a):
                  print(f'  SKIP (not found): {a}')
                  continue
              fname = os.path.basename(a)
              # Upload ONLY to latest/ — R2 keeps only the latest version
              dest_latest = f'${R2_BASE}/latest/{fname}'
              print(f'  Uploading {a} -> {dest_latest}')
              subprocess.run(['aws', 's3', 'cp', a, dest_latest, '--endpoint-url', '${R2_ENDPOINT}', '--no-progress'], check=True)
              print(f'  [OK] {fname}')
          print('R2 upload complete (latest only)')
          "

      - name: Generate Windows updater manifest
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          python apps/desktop/scripts/generate-updater-manifest.py \
            --version "${VERSION}" \
            --platform windows \
            --download-base "https://releases.orivraa.com/desktop/latest" \
            --output updater-manifest-windows.json

          echo "Generated Windows updater manifest:"
          cat updater-manifest-windows.json

      - name: Upload Windows updater manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-windows
          path: updater-manifest-windows.json
          if-no-files-found: error

      - name: Publish release to API
        shell: bash
        env:
          ORIVRAA_ADMIN_TOKEN: ${{ secrets.ORIVRAA_ADMIN_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          API_BASE="https://api.orivraa.com"
          # Latest version is served from R2; older versions stay on GitHub
          DOWNLOAD_BASE="https://releases.orivraa.com/desktop/latest"

          # Debug: check if ORIVRAA_ADMIN_TOKEN is set (print length only, not value)
          TOKEN_LEN=${#ORIVRAA_ADMIN_TOKEN}
          echo "ORIVRAA_ADMIN_TOKEN length: ${TOKEN_LEN}"
          if [ "${TOKEN_LEN}" -eq 0 ]; then
            echo "ERROR: ORIVRAA_ADMIN_TOKEN secret is empty or not set"
            exit 1
          fi
          if [ "${TOKEN_LEN}" -lt 50 ]; then
            echo "WARNING: ORIVRAA_ADMIN_TOKEN seems too short (${TOKEN_LEN} chars) — expected a JWT (~200+ chars) or gshop_ token"
          fi

          # Prefer src-tauri bundle dir (signed artifacts from tauri-action)
          BUNDLE_DIR=""
          for candidate in \
            "apps/desktop/src-tauri/target/release/bundle" \
            "apps/desktop/target/release/bundle"; do
            if [ -d "$candidate/nsis" ] || [ -d "$candidate/msi" ]; then
              BUNDLE_DIR="$candidate"
              break
            fi
          done
          if [ -z "$BUNDLE_DIR" ]; then
            echo "No Windows bundle directory found"
            exit 1
          fi
          NSIS_EXE=$(ls "$BUNDLE_DIR/nsis/"*.exe 2>/dev/null | head -1 || true)
          MSI_FILE=$(ls "$BUNDLE_DIR/msi/"*.msi 2>/dev/null | head -1 || true)

          # Prefer NSIS for the download page
          if [ -n "$NSIS_EXE" ]; then
            INSTALLER_NAME=$(basename "$NSIS_EXE")
            FILE_SIZE=$(stat -c%s "$NSIS_EXE" 2>/dev/null || wc -c < "$NSIS_EXE")
          elif [ -n "$MSI_FILE" ]; then
            INSTALLER_NAME=$(basename "$MSI_FILE")
            FILE_SIZE=$(stat -c%s "$MSI_FILE" 2>/dev/null || wc -c < "$MSI_FILE")
          else
            echo "No Windows installer found for API publish"
            exit 1
          fi

          DOWNLOAD_URL="${DOWNLOAD_BASE}/${INSTALLER_NAME}"

          echo "Publishing to API: v${VERSION} WINDOWS"
          echo "  URL: ${DOWNLOAD_URL}"
          echo "  Size: ${FILE_SIZE}"
          echo "  File: ${INSTALLER_NAME}"

          # Debug: check if ORIVRAA_ADMIN_TOKEN is set (print length only, not value)
          TOKEN_LEN=${#ORIVRAA_ADMIN_TOKEN}
          echo "  ORIVRAA_ADMIN_TOKEN length: ${TOKEN_LEN}"
          if [ "${TOKEN_LEN}" -eq 0 ]; then
            echo "ERROR: ORIVRAA_ADMIN_TOKEN secret is empty or not set"
            exit 1
          fi
          if [ "${TOKEN_LEN}" -lt 50 ]; then
            echo "WARNING: ORIVRAA_ADMIN_TOKEN seems too short (${TOKEN_LEN} chars) — expected a JWT (~200+ chars) or gshop_ token"
          fi

          # Build changelog from git log since last tag
          CHANGELOG=""
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges 2>/dev/null || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -10 --pretty=format:"- %s" --no-merges 2>/dev/null || echo "Release v${VERSION}")
          fi

          # POST to API with retry (capture HTTP status to detect failures).
          # Fails the job on non-2xx so silent publish failures surface.
          # Write changelog to a temp file to avoid shell escaping issues.
          echo "$CHANGELOG" > /tmp/changelog.txt
          PAYLOAD=$(python -c "
          import json
          with open('/tmp/changelog.txt') as f:
              changelog = f.read().strip()
          payload = {
              'version': '${VERSION}',
              'platform': 'WINDOWS',
              'downloadUrl': '${DOWNLOAD_URL}',
              'fileSize': int('${FILE_SIZE}'),
              'fileName': '${INSTALLER_NAME}',
              'changelog': changelog,
              'minOs': 'Windows 10 (1809+)',
              'architecture': 'x64'
          }
          print(json.dumps(payload))
          ")

          API_STATUS=""
          MAX_ATTEMPTS=3
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "API publish attempt ${ATTEMPT}/${MAX_ATTEMPTS} (Windows)"
            API_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/releases/publish" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${ORIVRAA_ADMIN_TOKEN}" \
              -d "$PAYLOAD") || true
            API_STATUS=$(echo "$API_RESPONSE" | tail -1)
            API_BODY=$(echo "$API_RESPONSE" | head -n -1)
            echo "API response status: ${API_STATUS}"
            echo "API response body: ${API_BODY}"
            if [ "${API_STATUS}" -ge 200 ] && [ "${API_STATUS}" -lt 300 ]; then
              echo "API publish succeeded (Windows)"
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done

          if [ "${API_STATUS}" -lt 200 ] || [ "${API_STATUS}" -ge 300 ]; then
            echo "ERROR: API publish failed after ${MAX_ATTEMPTS} attempts with status ${API_STATUS}"
            echo "Common causes:"
            echo "  - ORIVRAA_ADMIN_TOKEN secret is missing or expired"
            echo "  - API is down or returning errors"
            echo "  - Payload validation failed (check response body above)"
            exit 1
          fi
          echo "API publish complete (Windows)"

  # ─── macOS Build ──────────────────────────────────────
  build-macos:
    name: 🍎 macOS Build & Release
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build_macos == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      artifact-paths: ${{ steps.tauri-build.outputs.artifactPaths }}
      release-id: ${{ steps.tauri-build.outputs.releaseId }}
      release-url: ${{ steps.tauri-build.outputs.releaseUrl }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Verify desktop frontend (splash screen)
        shell: bash
        run: |
          # The desktop app uses a pre-built splash screen (dist-desktop/index.html)
          # that redirects to https://www.orivraa.com/auth/login.
          # No Next.js static export is needed — the app is a thin wrapper
          # around the production website.
          if [[ ! -f apps/desktop/dist-desktop/index.html ]]; then
            echo "ERROR: dist-desktop/index.html not found"
            exit 1
          fi
          echo "Desktop splash screen verified: dist-desktop/index.html"

      - name: Build Tauri app (signed, universal binary)
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Uncomment when Apple Developer signing is configured:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v${{ needs.resolve-version.outputs.version }}
          releaseName: "Orivraa Desktop v${{ needs.resolve-version.outputs.version }}"
          releaseBody: |
            ## Orivraa Desktop v${{ needs.resolve-version.outputs.version }}

            ### macOS Installer
            - **DMG**: Drag-and-drop installer for macOS 10.15+

            ### Downloads
            - **Latest version (R2)**: https://releases.orivraa.com/desktop/latest/
            - **This version (GitHub)**: See assets below

            > R2 hosts only the latest version. Older versions are available exclusively on GitHub Releases.
            > ⚠️ macOS builds are currently unsigned. You may need to right-click → Open to bypass Gatekeeper.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Sign macOS updater artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 apps/desktop/scripts/sign-updater-artifacts.py --platform macos

      - name: Clean old macOS installers from R2 latest/
        shell: bash
        run: |
          R2_LATEST="s3://${R2_BUCKET}/desktop/latest"
          echo "Cleaning old macOS files from ${R2_LATEST}/ ..."
          # Delete DMG/app objects under desktop/latest/ (preserve latest.json + Windows installers)
          aws s3 rm "${R2_LATEST}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --recursive \
            --exclude "latest.json" \
            --exclude "*.exe" \
            --exclude "*.msi" \
            --no-progress 2>/dev/null || true
          echo "R2 latest/ cleaned (latest.json + Windows installers preserved)"

      - name: Upload installers to R2 (latest only)
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          R2_BASE="s3://${R2_BUCKET}/desktop"

          ARTIFACTS='${{ steps.tauri-build.outputs.artifactPaths }}'
          echo "Artifact paths: $ARTIFACTS"

          python3 -c "
          import json, subprocess, sys, os, glob
          raw = r'''$ARTIFACTS'''
          if raw == 'null' or not raw.strip():
              artifacts = []
          else:
              artifacts = json.loads(raw)
          if not artifacts:
              print('No artifact paths returned, searching manually...')
              base = 'apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle'
              for pattern in [
                  f'{base}/macos/*.app.tar.gz',
                  f'{base}/dmg/*.dmg',
                  f'{base}/app/*.app',
              ]:
                  artifacts.extend(glob.glob(pattern))
          for a in artifacts:
              if not os.path.exists(a):
                  print(f'  SKIP (not found): {a}')
                  continue
              fname = os.path.basename(a)
              # Upload ONLY to latest/ — R2 keeps only the latest version
              dest_latest = f'${R2_BASE}/latest/{fname}'
              print(f'  Uploading {a} -> {dest_latest}')
              if fname.endswith('.app'):
                  subprocess.run(['aws', 's3', 'cp', a, dest_latest, '--endpoint-url', '${R2_ENDPOINT}', '--recursive', '--no-progress'], check=True)
              else:
                  subprocess.run(['aws', 's3', 'cp', a, dest_latest, '--endpoint-url', '${R2_ENDPOINT}', '--no-progress'], check=True)
              print(f'  [OK] {fname}')
          print('R2 upload complete (latest only)')
          "

      - name: Generate macOS updater manifest
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          python3 apps/desktop/scripts/generate-updater-manifest.py \
            --version "${VERSION}" \
            --platform macos \
            --download-base "https://releases.orivraa.com/desktop/latest" \
            --output updater-manifest-macos.json

          echo "Generated macOS updater manifest:"
          cat updater-manifest-macos.json

      - name: Upload macOS updater manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-macos
          path: updater-manifest-macos.json
          if-no-files-found: error

      - name: Publish release to API
        shell: bash
        env:
          ORIVRAA_ADMIN_TOKEN: ${{ secrets.ORIVRAA_ADMIN_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          API_BASE="https://api.orivraa.com"
          # Latest version is served from R2; older versions stay on GitHub
          DOWNLOAD_BASE="https://releases.orivraa.com/desktop/latest"

          # Debug: check if ORIVRAA_ADMIN_TOKEN is set (print length only, not value)
          TOKEN_LEN=${#ORIVRAA_ADMIN_TOKEN}
          echo "ORIVRAA_ADMIN_TOKEN length: ${TOKEN_LEN}"
          if [ "${TOKEN_LEN}" -eq 0 ]; then
            echo "ERROR: ORIVRAA_ADMIN_TOKEN secret is empty or not set"
            exit 1
          fi
          if [ "${TOKEN_LEN}" -lt 50 ]; then
            echo "WARNING: ORIVRAA_ADMIN_TOKEN seems too short (${TOKEN_LEN} chars) — expected a JWT (~200+ chars) or gshop_ token"
          fi

          BUNDLE_DIR=""
          for candidate in \
            "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle" \
            "apps/desktop/target/universal-apple-darwin/release/bundle"; do
            if [ -d "$candidate/dmg" ]; then
              BUNDLE_DIR="$candidate"
              break
            fi
          done
          if [ -z "$BUNDLE_DIR" ]; then
            echo "No macOS bundle directory found for API publish"
            exit 1
          fi
          DMG_FILE=$(ls "$BUNDLE_DIR/dmg/"*.dmg 2>/dev/null | head -1 || true)

          if [ -z "$DMG_FILE" ]; then
            echo "No macOS DMG found for API publish"
            exit 1
          fi

          INSTALLER_NAME=$(basename "$DMG_FILE")
          FILE_SIZE=$(stat -f%z "$DMG_FILE" 2>/dev/null || wc -c < "$DMG_FILE")
          DOWNLOAD_URL="${DOWNLOAD_BASE}/${INSTALLER_NAME}"

          echo "Publishing to API: v${VERSION} MACOS"
          echo "  URL: ${DOWNLOAD_URL}"
          echo "  Size: ${FILE_SIZE}"
          echo "  File: ${INSTALLER_NAME}"

          # Build changelog from git log
          CHANGELOG=""
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges 2>/dev/null || true)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -10 --pretty=format:"- %s" --no-merges 2>/dev/null || echo "Release v${VERSION}")
          fi

          # POST to API with retry (capture HTTP status to detect failures).
          # Fails the job on non-2xx so silent publish failures surface.
          # Write changelog to a temp file to avoid shell escaping issues.
          echo "$CHANGELOG" > /tmp/changelog.txt
          PAYLOAD=$(python3 -c "
          import json
          with open('/tmp/changelog.txt') as f:
              changelog = f.read().strip()
          payload = {
              'version': '${VERSION}',
              'platform': 'MACOS',
              'downloadUrl': '${DOWNLOAD_URL}',
              'fileSize': int('${FILE_SIZE}'),
              'fileName': '${INSTALLER_NAME}',
              'changelog': changelog,
              'minOs': 'macOS 12+',
              'architecture': 'universal'
          }
          print(json.dumps(payload))
          ")

          API_STATUS=""
          MAX_ATTEMPTS=3
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "API publish attempt ${ATTEMPT}/${MAX_ATTEMPTS} (macOS)"
            API_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${API_BASE}/api/releases/publish" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${ORIVRAA_ADMIN_TOKEN}" \
              -d "$PAYLOAD") || true
            API_STATUS=$(echo "$API_RESPONSE" | tail -1)
            API_BODY=$(echo "$API_RESPONSE" | head -n -1)
            echo "API response status: ${API_STATUS}"
            echo "API response body: ${API_BODY}"
            if [ "${API_STATUS}" -ge 200 ] && [ "${API_STATUS}" -lt 300 ]; then
              echo "API publish succeeded (macOS)"
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done

          if [ "${API_STATUS}" -lt 200 ] || [ "${API_STATUS}" -ge 300 ]; then
            echo "ERROR: API publish failed after ${MAX_ATTEMPTS} attempts with status ${API_STATUS}"
            echo "Common causes:"
            echo "  - ORIVRAA_ADMIN_TOKEN secret is missing or expired"
            echo "  - API is down or returning errors"
            echo "  - Payload validation failed (check response body above)"
            exit 1
          fi
          echo "API publish complete (macOS)"

  # ═══════════════════════════════════════════════════════════
  # Merge platform manifests and publish latest.json once
  # ═══════════════════════════════════════════════════════════
  publish-updater-manifest:
    name: 📦 Publish Updater Manifest
    needs: [resolve-version, build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows updater manifest
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: updater-manifest-windows
          path: manifests

      - name: Download macOS updater manifest
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: updater-manifest-macos
          path: manifests

      - name: Merge and validate latest.json
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          INPUTS=()
          REQUIRED=()

          if [ "${{ needs.build-windows.result }}" == "success" ]; then
            INPUTS+=("manifests/updater-manifest-windows.json")
            REQUIRED+=("windows-x86_64")
          fi

          if [ "${{ needs.build-macos.result }}" == "success" ]; then
            INPUTS+=("manifests/updater-manifest-macos.json")
            REQUIRED+=("darwin-aarch64" "darwin-x86_64")
          fi

          if [ ${#INPUTS[@]} -eq 0 ]; then
            echo "ERROR: No platform updater manifests available"
            exit 1
          fi

          VALIDATE=$(IFS=,; echo "${REQUIRED[*]}")

          python3 apps/desktop/scripts/merge-updater-manifests.py \
            --version "${VERSION}" \
            --inputs "${INPUTS[@]}" \
            --validate-platforms "${VALIDATE}" \
            --output latest.json

          echo "Final latest.json:"
          cat latest.json

      - name: Upload latest.json to R2
        shell: bash
        run: |
          aws s3 cp latest.json "s3://${R2_BUCKET}/desktop/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --no-progress
          echo "R2 latest.json uploaded"

      - name: Upload latest.json to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          gh release upload "desktop-v${VERSION}" latest.json --clobber
          echo "GitHub latest.json uploaded"

  # ═══════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════
  release-summary:
    name: 📊 Release Summary
    needs:
      [resolve-version, build-windows, build-macos, publish-updater-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Desktop Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.resolve-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Build | R2 Upload | API Publish |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows  | ${{ needs.build-windows.result }} | ${{ needs.build-windows.result }} | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS    | ${{ needs.build-macos.result }} | ${{ needs.build-macos.result }} | ${{ needs.build-macos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | ${{ needs.publish-updater-manifest.result }} | — | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Updater manifest" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary endpoint (GitHub)**: https://github.com/aakash-priyadarshi/gold-shop-app/releases/latest/download/latest.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Fallback endpoint (R2)**: https://releases.orivraa.com/desktop/latest.json" >> $GITHUB_STEP_SUMMARY
          echo "- **Installer CDN (latest)**: https://releases.orivraa.com/desktop/latest/" >> $GITHUB_STEP_SUMMARY
          echo "- Both endpoints serve the same manifest; platform \`url\` fields point to R2 installers." >> $GITHUB_STEP_SUMMARY

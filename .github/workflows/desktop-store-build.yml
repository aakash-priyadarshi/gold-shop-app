# ═══════════════════════════════════════════════════════════
# Orivraa Desktop — Microsoft Store MSIX build (no publish)
#
# Same flow as ViharaOS: Tauri release exe + Microsoft WinApp CLI pack.
# Does NOT upload to GitHub Releases, R2, or the API.
# MSIX is available only as a workflow artifact (90-day retention).
#
# Microsoft Learn:
#   https://learn.microsoft.com/en-us/windows/apps/dev-tools/winapp-cli/guides/tauri
#   https://learn.microsoft.com/en-us/windows/apps/dev-tools/winapp-cli/usage#pack
#   MCP: https://learn.microsoft.com/api/mcp
# ═══════════════════════════════════════════════════════════

name: Desktop Store Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 0.2.5 → MSIX 0.2.5.0)"
        required: false
        default: "0.2.5"

jobs:
  build-windows-msix:
    name: 🪟 Microsoft Store MSIX Build
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-31)
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@cc8ea9a08b3ee3db43d5aa6bddda4a0e87d800f7 # v0.1

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Verify desktop frontend (splash screen)
        shell: bash
        run: |
          if [[ ! -f apps/desktop/dist-desktop/index.html ]]; then
            echo "ERROR: dist-desktop/index.html not found"
            exit 1
          fi
          echo "Desktop splash screen verified"

      - name: Pack MSIX (Tauri + winapp)
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version || '0.2.5' }}"
          & apps/desktop/scripts/pack-msix.ps1 -Version $version

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orivraa-msix-${{ github.event.inputs.version || '0.2.5' }}
          path: apps/desktop/store-build-output/*.msix
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        shell: pwsh
        run: |
          $msix = Get-ChildItem apps/desktop/store-build-output/*.msix | Select-Object -First 1
          @"
          ## Microsoft Store MSIX build
          - **Version:** ${{ github.event.inputs.version || '0.2.5' }}
          - **Artifact:** ``$($msix.Name)`` ($([math]::Round($msix.Length/1MB,2)) MB)
          - **Tool:** Microsoft WinApp CLI (same as ViharaOS)
          - **Publish:** none (download from workflow Artifacts only)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

# Automated Test Suite
# Tests against PRODUCTION servers (api.orivraa.com / www.orivraa.com)
# No need to build or start local servers — everything runs online.

name: Production Monitor

on:
  workflow_dispatch: # manual trigger from GitHub UI
  schedule:
    - cron: "0 6 * * *" # daily at 6:00 UTC — monitors production health

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"
  # Production URLs — all tests run against these
  API_URL: "https://api.orivraa.com"
  SMOKE_TEST_URL: "https://api.orivraa.com"
  BASE_URL: "https://www.orivraa.com"
  API_BASE_URL: "https://api.orivraa.com/api"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════
  # Setup: Install Dependencies
  # ══════════════════════════════════════════════════════════
  setup:
    name: 📦 Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            e2e/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ══════════════════════════════════════════════════════════
  # Smoke Tests (against production API)
  # ══════════════════════════════════════════════════════════
  smoke-tests:
    name: 💨 Smoke Tests (Production)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            e2e/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Verify production API is reachable
        run: |
          echo "Testing production API connectivity..."
          echo "--- Response headers + body ---"
          curl -sS -D - \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; Orivraa-SmokeTest/1.0; +https://orivraa.com)" \
            "https://api.orivraa.com/api/health" | head -40
          echo ""
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; Orivraa-SmokeTest/1.0; +https://orivraa.com)" \
            "https://api.orivraa.com/api/health")
          echo "API health status: $STATUS"
          if [ "$STATUS" = "403" ]; then
            echo "⚠️ 403 Forbidden — likely Cloudflare Bot Fight Mode blocking CI runner IPs."
            echo "Fix: add a WAF exception in Cloudflare dashboard, or set SMOKE_TEST_URL to Railway direct URL."
          elif [ "$STATUS" != "200" ]; then
            echo "⚠️ Production API returned $STATUS — tests may fail"
          fi

      - name: Run smoke tests against production
        run: pnpm smoke-test:full
        env:
          SMOKE_TEST_URL: "https://api.orivraa.com/api"
          STRICT_SMOKE: "true"

  seller-api:
    name: Seller API pipeline (Production)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            e2e/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Authenticated seller API pipeline
        run: |
          if [[ -z "${{ secrets.SHOP_SMOKE_TOKEN }}" ]]; then
            echo "::error::SHOP_SMOKE_TOKEN is required for the production seller monitor"
            exit 1
          fi
          node e2e/scripts/api-core-pipeline.mjs
        env:
          E2E_API_URL: "https://api.orivraa.com/api"
          E2E_TOKEN: ${{ secrets.SHOP_SMOKE_TOKEN }}

      - name: Admin seller-core probe
        run: |
          TOKEN="${{ secrets.ORIVRAA_ADMIN_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::notice::ORIVRAA_ADMIN_TOKEN not set — skip in-process seller-core"
            exit 0
          fi
          CODE=$(curl -s -o /tmp/seller_core.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; Orivraa-SmokeTest/1.0; +https://orivraa.com)" \
            "https://api.orivraa.com/api/testing/seller-core")
          echo "HTTP $CODE"
          head -c 2000 /tmp/seller_core.json || true
          echo ""
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::seller-core returned $CODE (admin JWT/gshop token must have ADMIN role)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/seller_core.json"))
          payload = data.get("data", data)
          failed = payload.get("failed", 0)
          print(f"passed={payload.get('passed')} failed={failed} skipped={payload.get('skipped')}")
          if failed:
            raise SystemExit(1)
          PY

  # ══════════════════════════════════════════════════════════
  # E2E Browser Tests (Playwright → production)
  # ══════════════════════════════════════════════════════════
  e2e-tests:
    name: 🎭 E2E Browser Tests (Production)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            e2e/node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run Playwright tests against production
        run: pnpm e2e
        env:
          BASE_URL: "https://www.orivraa.com"
          API_BASE_URL: "https://api.orivraa.com/api"
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # Summary
  # ══════════════════════════════════════════════════════════
  test-summary:
    name: 📊 Test Summary
    needs: [smoke-tests, seller-api, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "## Test Results Summary (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: **api.orivraa.com** / **www.orivraa.com**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Seller API | ${{ needs.seller-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Browser | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Alert and fail when a production monitor is unhealthy
        if: needs.smoke-tests.result != 'success' || needs.seller-api.result != 'success' || needs.e2e-tests.result != 'success'
        run: |
          jq -n \
            --arg message "Production monitor failed (smoke=${{ needs.smoke-tests.result }}, seller=${{ needs.seller-api.result }}, browser=${{ needs.e2e-tests.result }})" \
            --arg page "github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{errorMessage:$message,page:$page,platform:"web",userRole:"SYSTEM",userAction:"Scheduled production monitoring",frustrationType:"deployment"}' \
            | curl -fsS -X POST "https://api.orivraa.com/api/crash-reports" \
                -H "Content-Type: application/json" --data-binary @- || true
          exit 1

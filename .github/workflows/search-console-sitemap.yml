name: Search Console Sitemap Sync

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate sitemap reachability without submitting to Search Console"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"

concurrency:
  group: search-console-sitemap
  cancel-in-progress: false

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Search Console config
        id: config
        env:
          SEARCH_CONSOLE_SITEMAP_URL: ${{ vars.SEARCH_CONSOLE_SITEMAP_URL }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_REFRESH_TOKEN }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
        shell: bash
        run: |
          SITEMAP_URL="$SEARCH_CONSOLE_SITEMAP_URL"
          if [[ -z "$SITEMAP_URL" ]]; then
            SITEMAP_URL="https://www.orivraa.com/sitemap.xml"
          fi

          echo "sitemap_url=$SITEMAP_URL" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$INPUT_DRY_RUN" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "auth_mode=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_SERVICE_ACCOUNT=false
          if [[ -n "$GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON" ]]; then
            HAS_SERVICE_ACCOUNT=true
          fi

          HAS_OAUTH=false
          if [[ -n "$GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID" && -n "$GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET" && -n "$GOOGLE_SEARCH_CONSOLE_OAUTH_REFRESH_TOKEN" ]]; then
            HAS_OAUTH=true
          fi

          if [[ -z "$SEARCH_CONSOLE_PROPERTY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "auth_mode=missing-property" >> "$GITHUB_OUTPUT"
            echo "::error::SEARCH_CONSOLE_PROPERTY is required for live sitemap submission."
            exit 1
          fi

          if [[ "$HAS_OAUTH" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=oauth-user" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$HAS_SERVICE_ACCOUNT" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=service-account" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "submit=false" >> "$GITHUB_OUTPUT"
          echo "auth_mode=missing-auth" >> "$GITHUB_OUTPUT"
          echo "::error::Search Console authentication is required for live sitemap submission."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Allow production deploy to settle
        if: steps.config.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          echo "Push trigger detected, waiting 8 minutes for production deploy to settle"
          sleep 480

      - name: Wait for sitemap to become reachable
        if: steps.config.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "${{ steps.config.outputs.sitemap_url }}" > /dev/null; then
              echo "::notice::Sitemap is reachable after $attempt attempt(s)"
              exit 0
            fi

            echo "Attempt $attempt of 30: sitemap not reachable yet, retrying in 30s"
            sleep 30
          done

          echo "::error::Sitemap not reachable after 30 attempts"
          exit 1

      - name: Submit sitemap to Search Console
        if: steps.config.outputs.ready == 'true'
        env:
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_ID }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_OAUTH_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SEARCH_CONSOLE_OAUTH_ACCOUNT_EMAIL }}
          SEARCH_CONSOLE_PROPERTY: ${{ secrets.SEARCH_CONSOLE_PROPERTY }}
          SEARCH_CONSOLE_SITEMAP_URL: ${{ steps.config.outputs.sitemap_url }}
        shell: bash
        run: |
          if [[ "${{ steps.config.outputs.submit }}" == "true" ]]; then
            pnpm seo:submit-sitemap
          else
            pnpm seo:submit-sitemap --dry-run
          fi

      - name: Workflow summary
        if: always() && steps.config.outputs.ready == 'true'
        run: |
          echo "## Search Console Sitemap Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitemap: ${{ steps.config.outputs.sitemap_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth mode: ${{ steps.config.outputs.auth_mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submission mode: ${{ steps.config.outputs.submit == 'true' && 'live submit' || 'dry run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

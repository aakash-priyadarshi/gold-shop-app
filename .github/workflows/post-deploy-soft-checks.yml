# Post-deploy critical checks. Failures create a crash report, which uses the
# existing Orivraa Error Bot Slack integration.

name: Post-Deploy Critical Checks

on:
  workflow_run:
    workflows: ["Deploy Guard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: post-deploy-critical-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.27.0"

jobs:
  wait-for-release:
    name: Exact Railway release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Wait until changed services expose the merged SHA
        run: |
          EXPECTED="${{ github.event.workflow_run.head_sha || github.sha }}"
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          API_CHANGED=false
          WEB_CHANGED=false
          if echo "$CHANGED" | grep -qE '^(apps/api/|packages/shared/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|turbo.json$)'; then
            API_CHANGED=true
          fi
          if echo "$CHANGED" | grep -qE '^(apps/web/|packages/shared/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|turbo.json$)'; then
            WEB_CHANGED=true
          fi

          for attempt in $(seq 1 30); do
            API_READY=true
            WEB_READY=true
            if [[ "$API_CHANGED" == "true" ]]; then
              API_SHA=$(curl -fsS "${{ secrets.PRODUCTION_API_URL }}/api/health" | jq -r '.release.sha // .data.release.sha // ""' || true)
              [[ "$API_SHA" == "$EXPECTED" ]] || API_READY=false
              echo "API release: ${API_SHA:-unavailable}"
            fi
            if [[ "$WEB_CHANGED" == "true" ]]; then
              WEB_SHA=$(curl -fsS "https://www.orivraa.com/api/build-info" | jq -r '.sha // ""' || true)
              [[ "$WEB_SHA" == "$EXPECTED" ]] || WEB_READY=false
              echo "Web release: ${WEB_SHA:-unavailable}"
            fi
            if [[ "$API_READY" == "true" && "$WEB_READY" == "true" ]]; then
              echo "::notice::Changed services expose exact commit $EXPECTED"
              exit 0
            fi
            [[ $attempt -eq 30 ]] || sleep 30
          done

          echo "::error::Railway did not expose commit $EXPECTED before timeout"
          exit 1

      - name: Alert Orivraa incident channel on failure
        if: failure()
        run: |
          jq -n \
            --arg message "Railway did not deploy the expected commit ${{ github.event.workflow_run.head_sha || github.sha }}" \
            --arg page "github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{errorMessage:$message,page:$page,platform:"web",userRole:"SYSTEM",userAction:"Exact production release verification",frustrationType:"deployment"}' \
            | curl -fsS -X POST "${{ secrets.PRODUCTION_API_URL }}/api/crash-reports" \
                -H "Content-Type: application/json" --data-binary @- || true

  critical-smoke:
    name: Critical API smoke
    runs-on: ubuntu-latest
    needs: wait-for-release
    if: >
      needs.wait-for-release.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full smoke suite
        id: smoke
        run: pnpm smoke-test:full
        env:
          SMOKE_TEST_URL: ${{ secrets.PRODUCTION_API_URL }}/api
          STRICT_SMOKE: "true"

      - name: Authenticated shop API smoke
        id: auth-smoke
        run: |
          TOKEN="${{ secrets.SHOP_SMOKE_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "::error::SHOP_SMOKE_TOKEN is required for critical production verification"
            exit 1
          fi
          API="${{ secrets.PRODUCTION_API_URL }}/api"
          UA="Mozilla/5.0 (compatible; Orivraa-SmokeTest/1.0; +https://orivraa.com)"
          FAIL=0

          check() {
            local name="$1" method="$2" path="$3" expect="$4"
            code=$(curl -s -o /tmp/smoke_body.json -w "%{http_code}" -X "$method" \
              -H "Authorization: Bearer $TOKEN" -H "User-Agent: $UA" \
              -H "Accept: application/json" "$API$path")
            if [[ "$code" == "$expect" ]]; then
              echo "::notice::$name → $code OK"
            else
              echo "::error::$name expected $expect got $code"
              FAIL=1
            fi
          }

          check "Invoice settings" GET "/invoices/settings" "200"
          check "Karigar snapshot" GET "/karigar/snapshot" "200"
          check "Shop materials" GET "/shops/my-shop/materials" "200"
          check "POS active session" GET "/pos/session/active" "200"
          check "Shop quotes list" GET "/shop-quotes" "200"

          if [[ "$FAIL" == "1" ]]; then
            echo "AUTH_SMOKE=warn" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "AUTH_SMOKE=ok" >> "$GITHUB_OUTPUT"

      - name: Seller API pipeline + PDF
        id: seller-api
        run: node e2e/scripts/api-core-pipeline.mjs
        env:
          E2E_API_URL: ${{ secrets.PRODUCTION_API_URL }}/api
          E2E_TOKEN: ${{ secrets.SHOP_SMOKE_TOKEN }}

      - name: Alert Orivraa incident channel on failure
        if: failure()
        run: |
          jq -n \
            --arg message "Critical authenticated production canary failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}" \
            --arg page "github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{errorMessage:$message,page:$page,platform:"web",userRole:"SYSTEM",userAction:"Authenticated post-deploy canary",frustrationType:"deployment"}' \
            | curl -fsS -X POST "${{ secrets.PRODUCTION_API_URL }}/api/crash-reports" \
                -H "Content-Type: application/json" --data-binary @- || true

  critical-e2e:
    name: Critical Playwright
    runs-on: ubuntu-latest
    needs: wait-for-release
    if: >
      needs.wait-for-release.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run public Playwright suite
        id: e2e
        working-directory: e2e
        run: npx playwright test
        env:
          CI: "true"
          BASE_URL: https://www.orivraa.com
          API_BASE_URL: https://api.orivraa.com/api

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            playwright-report/
            e2e-results/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Alert Orivraa incident channel on failure
        if: failure()
        run: |
          jq -n \
            --arg message "Production Playwright canary failed for commit ${{ github.event.workflow_run.head_sha || github.sha }}" \
            --arg page "github-actions://${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{errorMessage:$message,page:$page,platform:"web",userRole:"SYSTEM",userAction:"Post-deploy browser canary",frustrationType:"deployment"}' \
            | curl -fsS -X POST "${{ secrets.PRODUCTION_API_URL }}/api/crash-reports" \
                -H "Content-Type: application/json" --data-binary @- || true

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - main
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/package-lock.json"
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/.next/**"
  path_instructions:
    - path: "apps/api/**"
      instructions: |
        NestJS + Prisma API. Watch for production DB safety (no migrate reset),
        auth/tenant scoping, tax/pricing correctness, and consistent API response shapes.
    - path: "apps/web/**"
      instructions: |
        Next.js App Router. Prefer existing UI patterns, wrap user-facing strings with <T>,
        keep weights in grams internally, and avoid breaking shop country/tax preference flows.
    - path: "apps/api/prisma/**"
      instructions: |
        Schema and migrations are high risk. Flag destructive SQL, missing indexes on hot paths,
        and any change that could reset or force-rewrite production data.
    - path: "apps/{api,web}/**/{pos,invoices,shop-quotes,quotes,payments,payment-gateway,pricing,market-rates,fx-rates,auth}/**"
      instructions: |
        Treat these as revenue- or access-critical paths. Flag behavioral changes without
        regression coverage. Check rate freshness and fallback behavior, idempotency,
        authentication boundaries, handled error reporting, and user-visible failures.
    - path: ".github/workflows/**"
      instructions: |
        Verify PR checks exercise the PR commit rather than production. Flag
        continue-on-error, missing-secret skips, missing exact-SHA verification, and
        conditions that can create a false-green gate.
    - path: "apps/api/src/modules/{crash-reports,recovery-offers}/**"
      instructions: |
        Treat report content as untrusted diagnostic data. Check authorization, token
        hashing, PII exposure, deduplication, idempotency, rate limits, and ensure paid
        subscriptions cannot be silently replaced by promotional access.
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
